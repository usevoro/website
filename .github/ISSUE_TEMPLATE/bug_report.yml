name: Website bug
description: Report a problem with the VORO website.
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 'For vulnerabilities, use private reporting from SECURITY.md. This repository covers the website, not the desktop app.'
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected behavior and the page or section involved.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Use sample data and remove personal information from screenshots.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, operating system, and viewport
      placeholder: 'Firefox, Windows 11, 1440 × 900'
